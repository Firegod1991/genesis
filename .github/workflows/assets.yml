name: Dashboard assets

# Rebuilds the vendored map library, typeface and map styles from pinned packages,
# then starts Genesis with no Docker from a small real vault, proves the dashboard in a real browser
# and saves the README screenshots.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "dashboard/**"
      - "!dashboard/static/vendor/**"
      - "!dashboard/static/map-*.json"
      - ".github/workflows/assets.yml"

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vendor pinned packages
        run: node tools/vendor.mjs
      - name: Commit
        run: |
          git config user.name "Firegod1991"
          git config user.email "193648396+Firegod1991@users.noreply.github.com"
          git add dashboard/static/vendor dashboard/static/map-light.json dashboard/static/map-dark.json
          # Files pushed through the GitHub API arrive without the executable bit.
          git update-index --chmod=+x bin/genesis bin/genesis-desktop install.sh dashboard/server.py tools/screenshots.py \
            tools/package.py tools/ask_check.py "Start Genesis.command" "Stop Genesis.command" "Start Genesis.desktop" "Stop Genesis.desktop"
          if git diff --cached --quiet; then echo "Vendored files are current."; exit 0; fi
          git commit -m "dashboard: vendor pinned map library, typeface and styles"
          for _ in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1

  browser:
    name: Browser test and screenshots
    needs: vendor
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install osmium and a headless browser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool poppler-utils
          echo "GENESIS_VAULT=$RUNNER_TEMP/vault" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet playwright
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
      - name: Build a small real vault (Monaco)
        run: |
          # The map source drops a connection now and then, and a second try is cheap.
          for attempt in 1 2 3; do
            python3 -m genesis fetch --id map_assets --id global_power_plants --id bible_hboWLC --id bible_grctr --id bible_latVUC --id bible_eng-kjv --id bible_engwebp \
              && bash tools/monaco_vault.sh && python3 -m genesis maps world --maxzoom 5 && exit 0
            echo "Attempt $attempt did not finish. Waiting, then trying again."
            sleep 30
          done
          exit 1
      - name: Stock the shelves the pictures show
        run: |
          # Real books, manuals, plant guides and the Kiwix server, so every page in the README is pictured
          # with something on it. One source being down must not stop the pictures: a page needs only one of these.
          python3 -m genesis fetch --yes --keep-going --jobs 4 --id kiwix_tools \
            --id zimgit-water_en --id usda-2015_en --id zimgit-knots_en --id irp.fas.org_en_military-medicine \
            --id zimgit-medicine_en --id nhs.uk_en_medicines --id scoutwiki.org_en_all.maxi --id publicdomainrecipes.com_en_all \
            --id army_survival_manual --id basic_land_navigation --id water_sanitation_in_emergencies --id basic_fishing \
            --id care_of_game --id trapper_education_manual --id who_medicinal_plants_1 --id who_medicinal_plants_2 \
            --id wild_edibles_of_missouri --id edible_and_poisonous_mushrooms --id useful_wild_plants_us --id desert_foods \
            --id northwest_forest_plants --id alaska_forest_wildflowers \
            || echo "Some of the shelf did not come down. The pictures are taken from what did."
          python3 -m genesis ready
      - name: Start Genesis with no Docker and drive it in a browser
        run: |
          GENESIS_PORT=8765 python3 -m genesis start --no-browser
          for _ in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          "$RUNNER_TEMP/venv/bin/python" tools/screenshots.py http://127.0.0.1:8765 docs/img \
            --expect search,manuals,plants,library,reader,scripture,radio,phone
          python3 -m genesis stop
      - name: Commit screenshots
        run: |
          git config user.name "Firegod1991"
          git config user.email "193648396+Firegod1991@users.noreply.github.com"
          git add docs/img
          if git diff --cached --quiet; then echo "Screenshots unchanged."; exit 0; fi
          git commit -m "docs: refresh dashboard screenshots from a live Monaco vault"
          for _ in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
