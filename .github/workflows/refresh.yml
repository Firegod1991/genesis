name: Monthly refresh

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the first of every month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/packs/**"
      - "genesis/resolvers.py"
      - "genesis/refresh.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # a run that waited its turn starts from what the run before it committed
      - name: Resolve the newest version of everything
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m genesis refresh --jobs 8
      - name: Summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the new lock files
        run: |
          git config user.name "Firegod1991"
          git config user.email "193648396+Firegod1991@users.noreply.github.com"
          # These files are written from scratch by the step above, so they never need a merge. Put them
          # on top of whatever main is by now, and do it again if someone pushes in the same moment.
          for _ in 1 2 3; do
            if git fetch -q origin main; then
              git reset -q FETCH_HEAD
              git add catalog/lock docs/CATALOG.md reports/latest.md
              if git diff --cached --quiet; then
                echo "Nothing changed."
                exit 0
              fi
              git commit -q -m "catalog: refresh $(date -u +%Y-%m-%d)"
              git push origin HEAD:main && exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Publish the monthly release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tag="v$(date -u +%Y.%m)"
          title="Genesis catalog $(date -u +'%B %Y')"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" --notes-file reports/latest.md --target "$(git rev-parse HEAD)"
          elif [ "$EVENT" != "push" ]; then
            # The monthly run and a manual run rewrite the notes. A push that touches one pack does not.
            gh release edit "$tag" --notes-file reports/latest.md
          fi

  world:
    name: World data works end to end
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # the catalog the job above just committed
      - name: Fetch the world layers and map the way a new box does
        run: |
          echo "GENESIS_VAULT=$RUNNER_TEMP/vault" >> "$GITHUB_ENV"
          export GENESIS_VAULT="$RUNNER_TEMP/vault"
          python3 -m genesis fetch --id survival_layers_world --id world_overview --id map_assets
          python3 -m genesis verify
      - name: Ask it real questions
        run: python3 tools/world_check.py
