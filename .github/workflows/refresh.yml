name: Monthly refresh

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the first of every month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/packs/**"
      - "genesis/resolvers.py"
      - "genesis/refresh.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the newest version of everything
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m genesis refresh --jobs 8
      - name: Summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the new lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/lock docs/CATALOG.md reports/latest.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "catalog: refresh $(date -u +%Y-%m-%d)"
          # Another workflow may push at the same moment: rebase and try again.
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
      - name: Publish the monthly release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m)"
          title="Genesis catalog $(date -u +'%B %Y')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file reports/latest.md
          else
            gh release create "$tag" --title "$title" --notes-file reports/latest.md --target "$(git rev-parse HEAD)"
          fi
