name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["catalog/lock/**", "docs/CATALOG.md", "reports/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests, lint, compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install osmium and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool shellcheck
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Catalog lint
        run: python3 -m genesis lint
      - name: Shell lint
        run: shellcheck install.sh bin/genesis tools/monaco_vault.sh
      - name: Compose files are valid
        run: |
          docker compose -f compose.yaml --profile '*' config -q
          docker compose -f compose.yaml -f compose.gpu.yaml --profile ai config -q

  windows:
    name: Unit tests, lint and a real fetch on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Catalog lint
        run: python -m genesis lint
      - name: Machine report
        run: python -m genesis doctor
      - name: Fetch and verify real content
        env:
          GENESIS_VAULT: ${{ runner.temp }}/vault
        run: |
          python -m genesis fetch --id theographic --id copyparty
          python -m genesis verify
          python -c "import os; v = os.environ['GENESIS_VAULT']; [os.stat(os.path.join(v, p)) for p in ('study/theographic/json/people.json', 'tools/copyparty.exe')]"

  live:
    name: End to end on small real data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install osmium and use a scratch vault
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          echo "GENESIS_VAULT=$RUNNER_TEMP/vault" >> "$GITHUB_ENV"
      - name: Resolve the tools pack from live sources
        run: python3 -m genesis refresh --pack tools
      - name: Fetch and verify real content
        run: |
          python3 -m genesis fetch --id devdocs_en_zig --id bible_hboWLC --id bible_engwebp \
            --id epa_emergency_water_disinfection --id global_power_plants --id map_assets --id theographic
          python3 -m genesis verify
          test -s "$GENESIS_VAULT/study/theographic/json/people.json"
      - name: Build survival layers and a map for Monaco from OpenStreetMap
        run: |
          bash tools/monaco_vault.sh
          python3 -m genesis poi nearest --lat 43.7384 --lon 7.4246 -n 8
          python3 -m genesis poi stats | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['total'] > 50, d; assert 'water' in d['categories'] and 'medical' in d['categories'], d"
      - name: Cut the world map from the live planet build
        run: |
          python3 -m genesis maps world --maxzoom 3
          python3 -m genesis maps list
      - name: Dashboard answers
        run: |
          PORT=8765 python3 dashboard/server.py &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ | grep -q "Genesis"
          curl -fsS http://127.0.0.1:8765/api/maps | grep -q europe_monaco
          curl -fsS "http://127.0.0.1:8765/api/poi/nearest?lat=43.7384&lon=7.4246&each=1" | grep -q '"water": \[{'
          curl -fsS http://127.0.0.1:8765/api/scripture | grep -q hboWLC
          curl -fsS -o /dev/null -w '%{http_code}\n' -H 'Range: bytes=0-126' http://127.0.0.1:8765/maps/europe_monaco.pmtiles | grep -q 206
      - name: Seal
        run: python3 -m genesis seal && test -s "$GENESIS_VAULT/restore/MANIFEST.json"

  stack:
    name: Services start and answer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Build a small real vault
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          echo "GENESIS_VAULT=$RUNNER_TEMP/vault" >> "$GITHUB_ENV"
          export GENESIS_VAULT="$RUNNER_TEMP/vault"
          python3 -m genesis fetch --id devdocs_en_zig --id bible_engwebp --id global_power_plants --id map_assets
          bash tools/monaco_vault.sh
      - name: Start the core services
        run: python3 -m genesis up core
      - name: Every core service answers
        run: |
          wait_for() {  # address, then text the answer must contain
            for _ in $(seq 1 60); do
              if body=$(curl -fsS -m 5 "$1" 2> /dev/null) && grep -qi -- "$2" <<< "$body"; then echo "ok   $1"; return 0; fi
              sleep 2
            done
            echo "FAIL $1"
            return 1
          }
          wait_for http://127.0.0.1:8080/ "Genesis"
          # The dashboard container sees the vault read only. The layers must answer all the same.
          wait_for "http://127.0.0.1:8080/api/poi/nearest?lat=43.7384&lon=7.4246&each=1" '"water": \[{'
          wait_for http://127.0.0.1:8080/api/poi/stats '"total"'
          wait_for http://127.0.0.1:8080/api/maps europe_monaco
          wait_for http://127.0.0.1:8080/api/scripture engwebp
          wait_for http://127.0.0.1:8081/ "kiwix"
          wait_for http://127.0.0.1:8082/ "<html"
          python3 -m genesis ps
          # From inside the stack the dashboard must see its neighbours up.
          curl -fsS http://127.0.0.1:8080/api/services | python3 -c "import json,sys; up={s['id']: s['up'] for s in json.load(sys.stdin)}; assert up['kiwix'] and up['files'], up; print('dashboard sees kiwix and files up')"
      - name: Service logs when something failed
        if: failure()
        run: docker compose --project-name genesis logs --no-color --tail 60
      - name: Stop the services
        if: always()
        run: python3 -m genesis down
