name: CI

# Temporary diagnostic version on this branch only: every step is bounded and reports its
# outcome as a commit status, to find the step that never finishes. Not for main.

on:
  push:
    branches: [main]
    paths-ignore: ["catalog/lock/**", "docs/CATALOG.md", "reports/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Unit tests, lint, compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install osmium and shellcheck
        id: apt
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool shellcheck
      - name: Unit tests
        id: unit
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -m unittest discover -s tests -v
      - name: Catalog lint
        id: lint
        continue-on-error: true
        timeout-minutes: 2
        run: python3 -m genesis lint
      - name: Shell lint
        id: shell
        continue-on-error: true
        timeout-minutes: 2
        run: shellcheck install.sh bin/genesis
      - name: Compose files are valid
        id: compose
        continue-on-error: true
        timeout-minutes: 3
        run: |
          docker compose -f compose.yaml --profile '*' config -q
          docker compose -f compose.yaml -f compose.gpu.yaml --profile ai config -q
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOMES: apt=${{ steps.apt.outcome }} unit=${{ steps.unit.outcome }} lint=${{ steps.lint.outcome }} shell=${{ steps.shell.outcome }} compose=${{ steps.compose.outcome }}
        run: |
          d="${OUTCOMES//success/ok}"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=diag/test -f description="${d:0:140}"

  live:
    name: End to end on small real data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install osmium and use a scratch vault
        id: apt
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          echo "GENESIS_VAULT=$RUNNER_TEMP/vault" >> "$GITHUB_ENV"
      - name: Resolve the tools pack from live sources
        id: refresh
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -m genesis refresh --pack tools
      - name: Fetch a Kiwix book
        id: zim
        continue-on-error: true
        timeout-minutes: 4
        run: python3 -m genesis fetch --id devdocs_en_zig
      - name: Fetch two Bibles
        id: bible
        continue-on-error: true
        timeout-minutes: 4
        run: python3 -m genesis fetch --id bible_hboWLC --id bible_engwebp
      - name: Fetch a manual from EPA
        id: epa
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -m genesis fetch --id epa_emergency_water_disinfection
      - name: Fetch map assets and power plants
        id: data
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -m genesis fetch --id global_power_plants --id map_assets
      - name: Verify
        id: verify
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -m genesis verify
      - name: Build survival layers for Monaco from OpenStreetMap
        id: poi
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 -m genesis poi build --region europe/monaco --replace
          python3 -m genesis poi nearest --lat 43.7384 --lon 7.4246 -n 8
          python3 -m genesis poi stats | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['total'] > 50, d; assert 'water' in d['categories'] and 'medical' in d['categories'], d"
      - name: Cut maps from the live planet build
        id: maps
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 -m genesis maps region --region europe/monaco
          python3 -m genesis maps world --maxzoom 3
          python3 -m genesis maps list
      - name: Dashboard answers
        id: dash
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PORT=8765 python3 dashboard/server.py &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ | grep -q "Genesis"
          curl -fsS http://127.0.0.1:8765/api/maps | grep -q europe_monaco
          curl -fsS "http://127.0.0.1:8765/api/poi/nearest?lat=43.7384&lon=7.4246&each=1" | grep -q '"water": \[{'
          curl -fsS http://127.0.0.1:8765/api/scripture | grep -q hboWLC
          curl -fsS -o /dev/null -w '%{http_code}\n' -H 'Range: bytes=0-126' http://127.0.0.1:8765/maps/europe_monaco.pmtiles | grep -q 206
      - name: Seal
        id: seal
        continue-on-error: true
        timeout-minutes: 4
        run: python3 -m genesis seal && test -s "$GENESIS_VAULT/restore/MANIFEST.json"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOMES: apt=${{ steps.apt.outcome }} refresh=${{ steps.refresh.outcome }} zim=${{ steps.zim.outcome }} bible=${{ steps.bible.outcome }} epa=${{ steps.epa.outcome }} data=${{ steps.data.outcome }} verify=${{ steps.verify.outcome }} poi=${{ steps.poi.outcome }} maps=${{ steps.maps.outcome }} dash=${{ steps.dash.outcome }} seal=${{ steps.seal.outcome }}
        run: |
          d="${OUTCOMES//success/ok}"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=diag/live -f description="${d:0:140}"
