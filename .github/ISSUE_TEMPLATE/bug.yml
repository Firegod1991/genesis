name: Something is broken
description: A command fails, a download will not verify, or a page is wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: The command you ran and what it printed.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your system
      placeholder: Ubuntu 24.04, Python 3.12
  - type: input
    id: version
    attributes:
      label: Genesis version
      description: What `genesis --version` prints.
